<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการหอพัก - Baan Jiraporn (Cloud Version)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Sarabun', sans-serif; }
    @media print {
      body * { visibility: hidden; }
      body.printing-single #printInvoiceArea, 
      body.printing-single #printInvoiceArea * { visibility: visible; }
      body.printing-single #printInvoiceArea {
        position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 20px; box-shadow: none !important; border: none !important;
      }
      body.printing-batch #batchPrintContainer, 
      body.printing-batch #batchPrintContainer * { visibility: visible; }
      body.printing-batch #batchPrintContainer {
        position: absolute; left: 0; top: 0; width: 100%; display: flex; flex-wrap: wrap; margin: 0; padding: 0; align-content: flex-start;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <div id="batchPrintContainer" class="hidden"></div>

  <div id="loginScreen" class="fixed inset-0 bg-indigo-900 z-50 flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center">
      <div id="loginLogoContainer" class="w-24 h-24 mx-auto mb-4 rounded-full border-4 border-indigo-100 flex items-center justify-center bg-indigo-50 overflow-hidden shadow-inner">
        <i id="loginDefaultIcon" class="fa-solid fa-building text-4xl text-indigo-400"></i>
        <img id="loginDormLogo" src="" class="hidden w-full h-full object-cover">
      </div>
      <h2 class="text-2xl font-bold text-slate-800 mb-2" id="loginDormNameText">Baan Jiraporn</h2>
      <p class="text-xs text-slate-500 mb-6 bg-slate-100 p-2 rounded">เชื่อมต่อระบบ Cloud เรียบร้อย<br>กรุณาใช้อีเมลและรหัสผ่านเพื่อเข้าสู่ระบบ</p>
      
      <form onsubmit="handleFirebaseLogin(event)">
        <input type="email" id="loginEmail" placeholder="อีเมล (Email)" class="w-full px-4 py-3 border border-slate-300 rounded-xl mb-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
        <input type="password" id="loginPassword" placeholder="รหัสผ่าน (Password)" class="w-full px-4 py-3 border border-slate-300 rounded-xl mb-4 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
        <button type="submit" id="btnLogin" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-lg flex justify-center items-center gap-2">เข้าสู่ระบบ</button>
      </form>
    </div>
  </div>

  <div id="loadingScreen" class="fixed inset-0 bg-white z-40 hidden flex-col items-center justify-center p-4">
    <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-600 mb-4"></i>
    <p class="font-bold text-slate-700" id="loadingText">กำลังซิงค์ข้อมูลกับคลาวด์...</p>
  </div>

  <div id="mainApp" style="display: none;">
    <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-30 no-print">
      <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center">
        <div class="flex items-center space-x-3">
          <div id="headerLogoBox" class="w-10 h-10 rounded bg-white flex items-center justify-center overflow-hidden">
             <i id="headerIcon" class="fa-solid fa-building text-xl text-indigo-900"></i>
             <img id="headerImg" src="" class="hidden w-full h-full object-cover">
          </div>
          <div>
            <h1 class="text-xl font-bold leading-tight" id="headerDormName">Baan Jiraporn</h1>
            <p class="text-[10px] bg-green-500 text-white px-2 py-0.5 rounded-full inline-block mt-1"><i class="fa-solid fa-cloud-arrow-up"></i> Cloud Sync</p>
          </div>
        </div>
        <div class="flex items-center space-x-2 mt-2 sm:mt-0">
          <button onclick="handleFirebaseLogout()" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 rounded text-xs font-medium transition flex items-center gap-1.5"><i class="fa-solid fa-power-off"></i> ออกจากระบบ</button>
          <button onclick="exportDatabase()" class="px-3 py-1.5 bg-indigo-700 hover:bg-indigo-600 rounded text-xs font-medium transition flex items-center gap-1.5" title="สำรองเฉพาะข้อมูลข้อความ"><i class="fa-solid fa-download"></i> สำรองข้อมูล</button>
          <label class="px-3 py-1.5 bg-indigo-700 hover:bg-indigo-600 rounded text-xs font-medium cursor-pointer transition flex items-center gap-1.5">
            <i class="fa-solid fa-upload"></i> นำเข้า <input type="file" id="importFile" class="hidden" accept=".json" onchange="importDatabase(event)">
          </label>
        </div>
      </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 mt-6 no-print">
      <div class="flex border-b border-slate-300 space-x-2 sm:space-x-4 overflow-x-auto">
        <button onclick="switchTab('dashboard')" id="tab-btn-dashboard" class="tab-btn py-3 px-4 text-sm font-semibold border-b-2 border-indigo-700 text-indigo-700 flex items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-chart-pie"></i> แดชบอร์ด</button>
        <button onclick="switchTab('rooms')" id="tab-btn-rooms" class="tab-btn py-3 px-4 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-indigo-600 flex items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-door-closed"></i> ข้อมูลห้องพัก</button>
        <button onclick="switchTab('meters')" id="tab-btn-meters" class="tab-btn py-3 px-4 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-indigo-600 flex items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-bolt"></i> จดมิเตอร์</button>
        <button onclick="switchTab('billing')" id="tab-btn-billing" class="tab-btn py-3 px-4 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-indigo-600 flex items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-file-invoice-dollar"></i> ออกบิล</button>
        <button onclick="switchTab('summary')" id="tab-btn-summary" class="tab-btn py-3 px-4 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-indigo-600 flex items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-chart-line"></i> สรุปรายรับ-จ่าย</button>
        <button onclick="switchTab('settings')" id="tab-btn-settings" class="tab-btn py-3 px-4 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-indigo-600 flex items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-gear"></i> ตั้งค่า</button>
      </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-6">
      <section id="tab-dashboard" class="tab-content">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <div class="flex items-center justify-between"><span class="text-slate-500 text-sm">จำนวนห้องทั้งหมด</span><span class="p-2 bg-indigo-50 text-indigo-600 rounded-lg text-lg"><i class="fa-solid fa-hotel"></i></span></div>
            <div class="mt-2 flex items-baseline gap-2"><span class="text-2xl font-bold" id="dashTotalRooms">0</span><span class="text-xs text-slate-500">ห้อง</span></div>
          </div>
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <div class="flex items-center justify-between"><span class="text-slate-500 text-sm">ห้องมีผู้เช่า</span><span class="p-2 bg-emerald-50 text-emerald-600 rounded-lg text-lg"><i class="fa-solid fa-user-check"></i></span></div>
            <div class="mt-2 flex items-baseline gap-2"><span class="text-2xl font-bold text-emerald-600" id="dashOccupiedRooms">0</span><span class="text-xs text-slate-500">ห้อง</span></div>
          </div>
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <div class="flex items-center justify-between"><span class="text-slate-500 text-sm">ยอดเรียกเก็บรอบนี้</span><span class="p-2 bg-amber-50 text-amber-600 rounded-lg text-lg"><i class="fa-solid fa-sack-dollar"></i></span></div>
            <div class="mt-2 flex items-baseline gap-2"><span class="text-2xl font-bold text-amber-600" id="dashTotalBilled">0</span><span class="text-xs text-slate-500">บาท</span></div>
          </div>
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <div class="flex items-center justify-between"><span class="text-slate-500 text-sm">ชำระเงินแล้ว</span><span class="p-2 bg-blue-50 text-blue-600 rounded-lg text-lg"><i class="fa-solid fa-receipt"></i></span></div>
            <div class="mt-2 flex items-baseline gap-2"><span class="text-2xl font-bold text-blue-600" id="dashPaid
